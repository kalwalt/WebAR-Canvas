<!doctype html>
<!-- Browser check of the KPM worker path (issue #16). Copy next to the build's
     kpm_worker_browser.js/.wasm and videoTest.kpm.js/.wasm, serve the build directory and open
     kpm_worker_browser.html (?url=missing.js tests the fallback, ?kpmWorker=0 the switch).
     The result is printed in #result and as window.kwbResult. -->
<html lang="en">
<head><meta charset="utf-8"><title>KPM worker check</title></head>
<body>
<pre id="result">running</pre>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var out = document.getElementById('result');
  var startedAt = 0;
  var samples = [];  // main-thread duration of each step, ms
  window.Module = {
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    onRuntimeInitialized: function () {
      var url = params.get('url');
      var urlPtr = url ? Module.stringToNewUTF8(url) : 0;
      var started = Module._kwb_start(urlPtr, params.get('kpmWorker') === '0' ? 0 : 1);
      startedAt = performance.now();
      if (started !== 0) { finish({ error: 'kwb_start ' + started }); return; }
      var timer = setInterval(function () {
        var t0 = performance.now();
        var passes = Module._kwb_step();
        samples.push(performance.now() - t0);
        var reg = Module.__webarKpm;
        var entry = reg && reg.workers && reg.workers[Object.keys(reg.workers)[0]];
        if (passes >= 3 || performance.now() - startedAt > 15000) {
          clearInterval(timer);
          samples.sort(function (a, b) { return a - b; });
          finish({
            state: ['starting', 'worker', 'fallback'][Module._kwb_state()],
            passes: passes, found: Module._kwb_found(), page: Module._kwb_page(),
            z: Module._kwb_z(), poolBuffers: entry ? entry.pool.length : null,
            stepMsMedian: samples[samples.length >> 1], stepMsWorst: samples[samples.length - 1],
            elapsedMs: Math.round(performance.now() - startedAt)
          });
        }
      }, 16);
    }
  };
  function finish(result) {
    window.kwbResult = result;
    out.textContent = JSON.stringify(result, null, 1);
  }
  var s = document.createElement('script');
  s.src = 'kpm_worker_browser.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
