name: Build

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    # The same image as build-docker.js: the host tools are built in it too.
    container: emscripten/emsdk:4.0.17
    timeout-minutes: 120
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Test the build runner's checks
        run: node --test scripts/build-docker.test.js

      - name: Read the Filament submodule commit
        id: filament
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "sha=$(git rev-parse HEAD:third_party/filament)" >> "$GITHUB_OUTPUT"

      # Only the tools and the import file: the WASM build needs nothing else from out/host.
      - name: Cache the Filament host tools
        uses: actions/cache@v6
        with:
          path: |
            third_party/filament/out/host/tools/matc/matc
            third_party/filament/out/host/tools/resgen/resgen
            third_party/filament/out/host/tools/cmgen/cmgen
            third_party/filament/out/host/tools/glslminifier/glslminifier
            third_party/filament/out/host/tools/uberz/uberz
            third_party/filament/ImportExecutables-Release.cmake
          # -v2: uberz added (gltfio). Bump the suffix whenever the list of tools changes.
          key: filament-host-tools-${{ steps.filament.outputs.sha }}-emsdk-4.0.17-v2

      - name: Build the Filament host tools
        run: sh scripts/build-host-tools.sh

      - name: Build WebAR-Canvas
        run: sh scripts/build-wasm.sh

      - name: Run the tests (nft_tests, core_tests)
        run: sh scripts/test-wasm.sh

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: webar-canvas-wasm
          path: |
            build-wasm/videoTest.html
            build-wasm/videoTest.js
            build-wasm/videoTest.wasm
          if-no-files-found: error

  # The sokol renderer (#13): Filament is not checked out and no host tools are built, which
  # proves that WEBAR_RENDERER=sokol needs neither. sokol itself is vendored (third_party/sokol).
  wasm-sokol:
    name: WebAssembly build (sokol)
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.17
    timeout-minutes: 60
    env:
      WEBAR_RENDERER: sokol
      BUILD_DIR: build-wasm-sokol
    steps:
      - name: Check out without submodules
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check out WebARKitLib only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init third_party/WebARKitLib
          test ! -f third_party/filament/CMakeLists.txt

      - name: Build WebAR-Canvas
        run: sh scripts/build-wasm.sh

      - name: Run the tests (nft_tests, core_tests)
        run: sh scripts/test-wasm.sh

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: webar-canvas-wasm-sokol
          path: |
            build-wasm-sokol/videoTest.html
            build-wasm-sokol/videoTest.js
            build-wasm-sokol/videoTest.wasm
          if-no-files-found: error
