name: Pages

# Builds the app and publishes it on GitHub Pages.
#
# The workflow starts on every push, but its jobs run only on the repository's default
# branch (master in WebAR-Canvas; main or master in a repository made from the template):
# on any other branch they are skipped. To deploy from another branch instead, replace the
# `if:` of both jobs with a fixed branch, for example:
#   if: github.ref == 'refs/heads/release'
#
# Pages must be enabled with Settings -> Pages -> Source: "GitHub Actions" (docs/template.md).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is not cancelled by a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the app for Pages
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # The same image as build-docker.js and build.yml: the host tools are built in it too.
    container: emscripten/emsdk:4.0.17
    timeout-minutes: 120
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read the Filament submodule commit
        id: filament
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "sha=$(git rev-parse HEAD:third_party/filament)" >> "$GITHUB_OUTPUT"

      # Keep this step (paths and key) in step with the same step in build.yml.
      # Only the tools and the import file: the WASM build needs nothing else from out/host.
      - name: Cache the Filament host tools
        uses: actions/cache@v6
        with:
          path: |
            third_party/filament/out/host/tools/matc/matc
            third_party/filament/out/host/tools/resgen/resgen
            third_party/filament/out/host/tools/cmgen/cmgen
            third_party/filament/out/host/tools/glslminifier/glslminifier
            third_party/filament/out/host/tools/uberz/uberz
            third_party/filament/ImportExecutables-Release.cmake
          # -v2: uberz added (gltfio). Bump the suffix whenever the list of tools changes.
          key: filament-host-tools-${{ steps.filament.outputs.sha }}-emsdk-4.0.17-v2

      - name: Build the Filament host tools
        run: sh scripts/build-host-tools.sh

      - name: Build WebAR-Canvas
        run: sh scripts/build-wasm.sh

      # videoTest.html is also published as index.html, so the site root opens the app.
      - name: Collect the site
        run: |
          mkdir -p pages
          cp build-wasm/videoTest.html build-wasm/videoTest.js build-wasm/videoTest.wasm pages/
          cp build-wasm/videoTest.html pages/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5
